<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBELY - Profile</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #111;
            font-size: 14px;
        }

        .profile {
            width: 700px;
            max-width: 95%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .username {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .bio {
            color: #666;
        }

        .stats {
            display: flex;
            gap: 35px;
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .stat {
            text-align: center;
        }

        .number {
            font-size: 20px;
            font-weight: bold;
        }

        .label {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">VIBELY</div>

        <div class="nav-links">
            <a href="feed.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="index.html">Log Out</a>
        </div>

    </div>

    <div class="profile">

        <div class="profile-top">

            <div class="avatar">
                👤
            </div>

            <div>
                <div class="username" id="username">
                    User
                </div>

                <div class="bio">
                    Welcome to my VIBELY profile!
                </div>
            </div>

        </div>

        <div class="stats">

            <div class="stat">
                <div class="number">0</div>
                <div class="label">Posts</div>
            </div>

            <div class="stat">
                <div class="number">0</div>
                <div class="label">Followers</div>
            </div>

            <div class="stat">
                <div class="number">0</div>
                <div class="label">Following</div>
            </div>

        </div>

    </div>

    <script>
        const username = localStorage.getItem("vibelyUsername");

        if (username) {
            document.getElementById("username").textContent = username;
        }
    </script>

</body>
</html>
