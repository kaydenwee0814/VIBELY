<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | VIBELY</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 320px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #6c63ff;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #6c63ff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">VIBELY</div>

        <h2>Forgot Password?</h2>

        <p>
            Password recovery is not available yet.
            Please return to the Log In page.
        </p>

        <a href="login.html">← Back to Log In</a>
    </div>
</body>
</html>
