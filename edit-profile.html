<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBELY - Edit Profile</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .edit-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="edit-box">

        <h2>Edit Profile</h2>

        <form id="editForm">

            <label>Username</label>
            <input type="text" id="username" required>

            <label>Bio</label>
            <textarea id="bio" placeholder="Write something about yourself..."></textarea>

            <button type="submit">Save Changes</button>

        </form>

        <a class="back" href="profile.html">← Back to Profile</a>

    </div>

    <script>
        const usernameInput = document.getElementById("username");

        const savedUsername = localStorage.getItem("vibelyUsername");
        const savedBio = localStorage.getItem("vibelyBio");

        if (savedUsername) {
            usernameInput.value = savedUsername;
        }const bio = localStorage.getItem("vibelyBio");

if (bio) {
    document.getElementById("bio").textContent = bio;
}

        if (savedBio) {
            document.getElementById("bio").value = savedBio;
        }

        document.getElementById("editForm").addEventListener("submit", function(event) {
            event.preventDefault();

            localStorage.setItem(
                "vibelyUsername",
                usernameInput.value
            );

            localStorage.setItem(
                "vibelyBio",
                document.getElementById("bio").value
            );

            alert("Profile updated!");

            window.location.href = "profile.html";
        });
    </script>

</body>
</html>
