<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBELY - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .signup-box {
            width: 360px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #777;
        }

        .signup-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .signup-button:hover {
            opacity: 0.85;
        }

        .login-text {
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .login-text a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <div class="logo">VIBELY</div>

        <div class="subtitle">
            Create your account
        </div>

        <form id="signupForm">
            <input type="text" placeholder="Username" required>

            <input type="email" placeholder="Email" required>

            <input type="password" placeholder="Password" required>

            <button class="signup-button" type="submit">
                Sign Up
            </button>
        </form><script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const username = document.querySelector('input[type="text"]').value;
        const email = document.querySelector('input[type="email"]').value;
        const password = document.querySelector('input[type="password"]').value;

        localStorage.setItem("vibelyUsername", username);
        localStorage.setItem("vibelyEmail", email);
        localStorage.setItem("vibelyPassword", password);

        alert("Account created successfully!");

        window.location.href = "login.html";
    });
</script>

        <div class="login-text">
            Already have an account?
            <a href="index.html">Log In</a>
        </div>

    </div>

</body>
</html>
