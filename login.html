<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBELY - Log In</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .signup-text {
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }

        .signup-text a {
            color: #111;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">VIBELY</div>

        <div class="subtitle">
            Welcome back
        </div>

        <form>
            <input type="text" placeholder="Username" required>

            <input type="password" placeholder="Password" required>

            <button class="login-button" type="submit">
                Log In
            </button>
        </form>

        <div class="signup-text">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </div>

    </div>

</body>
</html>
