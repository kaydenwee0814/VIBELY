<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBELY - Feed</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #111;
            font-size: 14px;
        }

        .feed {
            width: 600px;
            max-width: 95%;
            margin: 30px auto;
        }

        .post {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .post-header {
            padding: 15px;
            font-weight: bold;
        }

        .post-image {
            width: 100%;
            height: 350px;
            background: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
        }

        .post-content {
            padding: 15px;
        }

        .actions {
            margin-bottom: 10px;
        }

        .actions button {
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
            margin-right: 10px;
        }

        .caption {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">VIBELY</div>

        <div class="nav-links">
            <a href="feed.html">Home</a>
            <a href="index.html">Log Out</a>
        </div>
    </div>

    <div class="feed">

        <div class="post">

            <div class="post-header">
                @vibely_user
            </div>

            <div class="post-image">
                Your photo
            </div>

            <div class="post-content">

                <div class="actions">
                    <button>♡</button>
                    <button>💬</button>
                    <button>↗</button>
                </div>

                <div class="caption">
                    <b>@vibely_user</b> Welcome to VIBELY! 🎉
                </div>

            </div>

        </div>

        <div class="post">

            <div class="post-header">
                @vibely_user2
            </div>

            <div class="post-image">
                Your photo
            </div>

            <div class="post-content">

                <div class="actions">
                    <button>♡</button>
                    <button>💬</button>
                    <button>↗</button>
                </div>

                <div class="caption">
                    <b>@vibely_user2</b> Having a great day! ✨
                </div>

            </div>

        </div>

    </div>

</body>
</html>
