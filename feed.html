<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBELY - Feed</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            height: 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links a {
            margin-left: 20px;
            text-decoration: none;
            color: #111;
            font-size: 14px;
        }

        .feed {
            width: 600px;
            max-width: 95%;
            margin: 30px auto;
        }

        .post {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .post-header {
            padding: 15px;
            font-weight: bold;
        }

        .post-image {
            width: 100%;
            height: 350px;
            background: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
        }

        .post-content {
            padding: 15px;
        }

        .actions {
            margin-bottom: 10px;
        }

        .actions button {
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
            margin-right: 10px;
        }

        .caption {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">VIBELY</div>
<div class="nav-links">
    <a href="feed.html">Home</a>
    <a href="profile.html">Profile</a>
    <a href="index.html">Log Out</a>
</div>
    </div>

    <div class="feed">

        <div class="post">

            <div class="post-header">
                @vibely_user
            </div>

            <div class="post-image">
                Your photo
            </div>

            <div class="post-content">

                <div class="actions">
                    <button>♡</button>
                    <button>💬</button>
                    <button>↗</button>
                </div>

                <div class="caption">
                    <b>@vibely_user</b> Welcome to VIBELY! 🎉
                </div>

            </div>

        </div>

<div class="create-post">
    <h3>Create a Post</h3>

    <form id="createPostForm">
        <textarea
            id="postCaption"
            placeholder="What's on your mind?"
            required
        ></textarea>

        <input
            type="file"
            id="postPhoto"
            accept="image/*"
        >

        <button type="submit">Post</button>
    </form>
</div>

        <div class="post">

            <div class="post-header">
                @vibely_user2
            </div>

            <div class="post-image">
                Your photo
            </div>

            <div class="post-content">

                <div class="actions">
                    <button>♡</button>
                    <button>💬</button>
                    <button>↗</button>
                </div>

                <div class="caption">
                    <b>@vibely_user2</b> Having a great day! ✨
                </div>

            </div>

        </div>

    </div>

<script>
const postForm = document.getElementById("createPostForm");
const captionInput = document.getElementById("postCaption");
const photoInput = document.getElementById("postPhoto");

function showPost(caption, photo, username) {
    const post = document.createElement("div");
    post.className = "post";

    const header = document.createElement("div");
    header.className = "post-header";
    header.textContent = "@" + username;
    post.appendChild(header);

    if (photo) {
        const imageBox = document.createElement("div");
        imageBox.className = "post-image";

        const img = document.createElement("img");
        img.src = photo;
        img.alt = "Post photo";
        img.style.width = "100%";
        img.style.display = "block";

        imageBox.appendChild(img);
        post.appendChild(imageBox);
    }

    const content = document.createElement("div");
    content.className = "post-content";

    const captionBox = document.createElement("div");
    captionBox.className = "caption";

    const name = document.createElement("b");
    name.textContent = "@" + username + " ";

   
    captionBox.appendChild(name);
    captionBox.appendChild(document.createTextNode(caption));
    content.appendChild(captionBox);

    const likeButton = document.createElement("button");
    const likeCount = document.createElement("span");


    const likeKey = "vibelyLiked_" + username + "_" + caption;
    let liked = localStorage.getItem(likeKey) === "true";
    let likes = liked ? 1 : 0;

    likeButton.textContent = liked ? "♥ Liked" : "♡ Like";
    likeCount.textContent = " " + likes + (likes === 1 ? " like" : " likes");


    likeButton.style.cursor = "pointer";
    likeButton.style.marginTop = "10px";

   
    likeButton.addEventListener("click", function() {
        liked = !liked;
        likes = liked ? 1 : 0;

        localStorage.setItem(likeKey, String(liked));

        likeButton.textContent = liked ? "♥ Liked" : "♡ Like";
        likeCount.textContent = " " + likes + (likes === 1 ? " like" : " likes");
    });

    content.appendChild(likeButton);
    content.appendChild(likeCount);

    // Comments section
    const commentKey = "vibelyComments_" + username + "_" + caption;

  
    const commentsBox = document.createElement("div");
    commentsBox.className = "comments";
    commentsBox.style.display = "block";
    commentsBox.style.visibility = "visible";
    commentsBox.style.marginTop = "12px";
    commentsBox.style.padding = "10px";
    commentsBox.style.borderTop = "1px solid #ddd";

    const commentsList = document.createElement("div");
    commentsList.style.display = "block";

    const commentsList = document.createElement("div");
    commentsBox.appendChild(commentsList);

    let comments = [];

    try {
        comments = JSON.parse(
            localStorage.getItem(commentKey) || "[]"
        );
    } catch (error) {
        comments = [];
    }

    function displayComments() {
        commentsList.replaceChildren();

        comments.forEach(function(comment) {
            const line = document.createElement("p");
            line.textContent = "@" + comment.username + ": " + comment.text;
            commentsList.appendChild(line);
        });
    }

    displayComments();

    const commentForm = document.createElement("form");
    const commentInput = document.createElement("input");
    const commentButton = document.createElement("button");

    commentInput.type = "text";
    commentInput.placeholder = "Write a comment...";
    commentInput.required = true;

    commentButton.type = "submit";
    commentButton.textContent = "Comment";

    commentForm.appendChild(commentInput);
    commentForm.appendChild(commentButton);

    commentForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const text = commentInput.value.trim();

        if (!text) return;

        const newComment = {
            username: localStorage.getItem("vibelyUsername") || "vibely_user",
            text: text
        };

        comments.push(newComment);

        try {
            localStorage.setItem(commentKey, JSON.stringify(comments));
        } catch (error) {
            comments.pop();
            alert("Could not save comment. Browser storage may be full.");
            return;
        }

        displayComments();
        commentInput.value = "";
    });

    commentsBox.appendChild(commentForm);
    content.appendChild(commentsBox);

    post.appendChild(content);


    const createPost = document.querySelector(".create-post");
    createPost.insertAdjacentElement("afterend", post);
}

let savedPosts = [];

try {
    savedPosts = JSON.parse(
        localStorage.getItem("vibelyPosts") || "[]"
    );
} catch (error) {
    savedPosts = [];
}

savedPosts.slice().reverse().forEach(function(item) {
    showPost(item.caption, item.photo, item.username);
});

postForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const caption = captionInput.value.trim();
    const file = photoInput.files[0];
    const username =
        localStorage.getItem("vibelyUsername") || "vibely_user";

    if (!caption) {
        alert("Please write a caption!");
        return;
    }

    function publishPost(photo) {
        const newPost = {
            caption: caption,
            photo: photo,
            username: username
        };

        try {
            savedPosts.unshift(newPost);
            localStorage.setItem(
                "vibelyPosts",
                JSON.stringify(savedPosts)
            );
        } catch (error) {
            savedPosts.shift();
            alert("Storage is full. Try a smaller photo.");
            return;
        }

        showPost(caption, photo, username);
        captionInput.value = "";
        photoInput.value = "";
        alert("Post published!");
    }

    if (file) {
        if (!file.type.startsWith("image/")) {
            alert("Please choose an image file.");
            return;
        }

        if (file.size > 1024 * 1024) {
            alert("Please choose a photo smaller than 1 MB.");
            return;
        }

        const reader = new FileReader();

        reader.onload = function() {
            publishPost(reader.result);
        };

        reader.onerror = function() {
            alert("Could not read the photo. Please try again.");
        };

        reader.readAsDataURL(file);
    } else {
        publishPost("");
    }
});
</script>

</body>
</html>
